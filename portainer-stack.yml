# =============================================================================
# VideoSphere — Portainer Stack (copy/paste)
# =============================================================================
#
# 1. Portainer → Stacks → Add stack
# 2. Paste this entire file into the "Web editor"
# 3. Under "Environment variables", add at least the REQUIRED keys below
# 4. Deploy the stack
#
# REQUIRED stack environment variables:
#   MONGO_ROOT_PASSWORD   strong password (used by Mongo + app connection string)
#   NEXT_PUBLIC_APP_URL   URL you use in the browser, e.g. http://192.168.1.38:9624
#                         or https://my.domain.com behind Nginx Proxy Manager.
#                         Required for OAuth redirect URIs and session cookies.
#   JWT_SECRET            node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#   TOKEN_ENCRYPTION_KEY  node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
#   R2_ACCOUNT_ID         Cloudflare R2 staging storage (uploads do not work without R2)
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME        defaults to videosphere-uploads if omitted
#
# Optional — Sign in with Google (email/password login works without these):
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#
# Optional — platform distribution (each platform is independent; YouTube ≠ Google login):
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
#   VIMEO_CLIENT_ID / VIMEO_CLIENT_SECRET
#   FACEBOOK_APP_ID / FACEBOOK_APP_SECRET
#   GOOGLE_DRIVE_CLIENT_ID / GOOGLE_DRIVE_CLIENT_SECRET
# Optional — live audio translation RTMP ingest (browser mic works without this):
#   TRANSLATION_RTMP_PUBLIC_HOST   e.g. 192.168.1.38:1935 or rtmp://my.host:1935
#   TRANSLATION_RTMP_PATH_PREFIX   defaults to live
#   TRANSLATION_MEDIAMTX_RTSP_BASE defaults to rtsp://mediamtx:8554 (Compose DNS).
#                                 Harmless when mediamtx is commented out — the app
#                                 probe fails and RTMP UI stays inactive until the
#                                 sidecar is running.
# Uncomment the mediamtx service below when you want OBS/RTMP ingest.
# Per-user OpenRouter / GCP keys are configured in the app UI (not stack env).
#
# Add optional keys as stack environment variables only when you use that feature.
#
# GHCR private images: log the Portainer host into ghcr.io first (Registries).
#
# Multi-arch image: linux/amd64, linux/arm64 (Odroid HC4 and similar).
# Docker pulls the variant that matches your host. 32-bit ARM (e.g. HC2) is not supported.
#
# DATA LOCATION:
#   VideoSphere itself is stateless — uploaded media goes to Cloudflare R2, not local
#   disk, so the "app" container has nothing durable on disk and uses no bind mount.
#   MongoDB is the only local state. By default it's stored in a named Docker volume
#   (usually under /var/lib/docker/volumes/...).
#
#   Back up with mongodump (portable archive), not by tarballing live /data/db files.
#   See docs/deployment-guide.md → "MongoDB backup and restore".
#
#   To control where WiredTiger files live on the host (layout / capacity — not a
#   backup method), this stack can bind-mount instead, under:
#     /srv/AppData/videosphere/mongo
#
#   Before deploying a bind mount, create that folder on the Portainer host:
#     mkdir -p /srv/AppData/videosphere/mongo
#
#   If you'd rather use a Docker-managed named volume instead (no host path to manage),
#   replace the "volumes:" line under the mongo service with:
#     - mongo-data:/data/db
#   and add this at the bottom of the file:
#     volumes:
#       mongo-data:
# =============================================================================

services:
  app:
    image: ghcr.io/threehappypenguins/videosphere:latest
    container_name: videosphere
    restart: unless-stopped
    ports:
      - '9624:9624'
    # For SMB backup to LAN NAS/Windows shares (TCP 445) on Linux, uncomment:
    # network_mode: host
    # With network_mode: host, published ports are ignored — the app listens on :9624 on the host.
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL to your browser URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-VideoSphere}
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}@mongo:27017/videosphere?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_SESSION_COOKIE_NAME: ${JWT_SESSION_COOKIE_NAME:-videosphere_session}
      JWT_SESSION_MAX_AGE_SECONDS: ${JWT_SESSION_MAX_AGE_SECONDS:-315360000}
      TOTP_TRUST_COOKIE_NAME: ${TOTP_TRUST_COOKIE_NAME:-videosphere_totp_trust}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-videosphere-uploads}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      VIMEO_CLIENT_ID: ${VIMEO_CLIENT_ID:-}
      VIMEO_CLIENT_SECRET: ${VIMEO_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      TRANSLATION_RTMP_PUBLIC_HOST: ${TRANSLATION_RTMP_PUBLIC_HOST:-}
      TRANSLATION_RTMP_PATH_PREFIX: ${TRANSLATION_RTMP_PATH_PREFIX:-live}
      TRANSLATION_MEDIAMTX_RTSP_BASE: ${TRANSLATION_MEDIAMTX_RTSP_BASE:-rtsp://mediamtx:8554}
      PLATFORM_UPLOAD_TIMEOUT_MS: ${PLATFORM_UPLOAD_TIMEOUT_MS:-}
      UPLOAD_STALE_RECONCILE_MS: ${UPLOAD_STALE_RECONCILE_MS:-}
      UPLOAD_SERMONAUDIO_UNPUBLISHED_STALE_RECONCILE_MS: ${UPLOAD_SERMONAUDIO_UNPUBLISHED_STALE_RECONCILE_MS:-}
    depends_on:
      mongo:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # OPTIONAL — MediaMTX for RTMP audio ingest (live audio translation)
  # Uncomment this entire service only if you need OBS/RTMP instead of (or in
  # addition to) the in-app "Add audio" microphone capture.
  # App already defaults TRANSLATION_MEDIAMTX_RTSP_BASE to rtsp://mediamtx:8554.
  # Set TRANSLATION_RTMP_PUBLIC_HOST in stack env; Translation page probes MediaMTX
  # and only then shows stream-key controls.
  # Default installs should leave this commented so no extra container runs.
  # ---------------------------------------------------------------------------
  # mediamtx:
  #   image: bluenviron/mediamtx:latest
  #   container_name: videosphere-mediamtx
  #   restart: unless-stopped
  #   ports:
  #     - '1935:1935'   # RTMP
  #     - '8554:8554'   # RTSP (app pulls PCM for STT)
  #   environment:
  #     MTX_RTMP: 'yes'
  #     MTX_RTSP: 'yes'
  #     MTX_HLS: 'no'
  #     MTX_WEBRTC: 'no'
  #     MTX_SRT: 'no'
  #     MTX_AUTHMETHOD: http
  #     MTX_AUTHHTTPADDRESS: http://app:9624/api/translation/rtmp/auth
  #   depends_on:
  #     - app

  mongo:
    image: mongo:8
    container_name: videosphere-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: videosphere
    volumes:
      - mongo-data:/data/db # remove this line if using your own bind mount
      # - /srv/AppData/videosphere/mongo:/data/db # modify address to the left of the colon accordingly
    # Cap WiredTiger cache on memory-constrained hosts (e.g. 4GB Odroid); default is ~50% of (RAM - 1GB).
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.5']
    # mongosh writes ~/.mongodb/mongosh/*_log on every invocation unless
    # disableLogging is set in /etc/mongosh.conf before the process starts
    # (config.set in --eval is too late). See:
    # https://www.mongodb.com/docs/mongodb-shell/logs/disable/
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (test -f /etc/mongosh.conf
          || printf 'mongosh:\n  disableLogging: true\n  enableTelemetry: false\n' > /etc/mongosh.conf)
          && mongosh --quiet --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

# Remove the volumes block below if using your own bind mount instead
volumes:
  mongo-data:
